<script>/* Moving home: daniturn3.github.io/nightjar-radio → radio.churr.co.uk. Saved data is copied (never deleted) from the old address to the new one.
   Old app builds (before MOVE_APP) can't open the new address, so they stay on the old one. Strings are split so the address-rewriter leaves them alone. */
(function(){try{
  var NEWH='radio.churr.co.uk',OLDH='daniturn3'+'.github'+'.io',OLDP='/nightjar'+'-radio',MOVE_APP=134,L=localStorage,ok=!window.NJR||(window.NJR.version&&window.NJR.version()>=MOVE_APP);
  var keys=function(){var o={};for(var i=0;i<L.length;i++){var k=L.key(i);if(k&&k.indexOf('njr_')===0&&k!=='njr_movedOut')o[k]=L.getItem(k)}return o};
  var b64=function(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
  var unb64=function(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))};
  var stop=function(){document.documentElement.style.visibility='hidden';window.njrMoving=true;setTimeout(function(){document.documentElement.style.visibility=''},5000)};
  if(location.hostname===OLDH&&ok){
    // Old address: hand everything to the new one (only once unless the new one asks again)
    var ask=/[?&]njrpull=1/.test(location.search),search=location.search.replace(/[?&]njrpull=1/,'').replace(/^&/,'?');
    var path=location.pathname.indexOf(OLDP)===0?location.pathname.slice(OLDP.length)||'/':location.pathname;
    var data=(ask||!L.getItem('njr_movedOut'))?keys():null,pay=data&&Object.keys(data).length?b64(JSON.stringify(data)):'-';
    if(pay.length>1500000){delete data.njr_log;pay=b64(JSON.stringify(data))}
    L.setItem('njr_movedOut',String(Date.now()));stop();
    location.replace('https://'+NEWH+path+search+'#njrmove='+pay);
  }else if(location.hostname===NEWH){
    var m=location.hash.match(/^#njrmove=([^&]*)/);
    if(m){
      if(!L.getItem('njr_movedAt')&&m[1]&&m[1]!=='-'){var d=JSON.parse(unb64(m[1]));for(var k in d)if(k.indexOf('njr_')===0&&L.getItem(k)==null)L.setItem(k,d[k])}
      L.setItem('njr_movedAt',String(Date.now()));
      history.replaceState(null,'',location.pathname+location.search);
    }else if(!L.getItem('njr_movedAt')&&!sessionStorage.getItem('njr_pulled')){
      // First visit here: ask the old address once for anything saved there
      sessionStorage.setItem('njr_pulled','1');stop();
      location.replace('https://'+OLDH+OLDP+location.pathname+(location.search?location.search+'&':'?')+'njrpull=1');
    }
  }
}catch(e){document.documentElement.style.visibility=''}})();</script>
<script>/* Web channels: the app shows Stable (this folder's root), Beta (beta/) or Test (next/) — see CLAUDE.md */
window.ROOT='https://daniturn3.github.io/nightjar-radio/';window.WEBCH=/\/nightjar-radio\/next\//.test(location.pathname)?'test':/\/nightjar-radio\/beta\//.test(location.pathname)?'beta':'stable';if(WEBCH!=='stable'){const m=document.createElement('meta');m.name='robots';m.content='noindex,nofollow';document.head.append(m)}
window.njrRoute=function(){try{if(!window.NJR||window.njrMoving)return;var L=localStorage,want=L.getItem('njr_tester')==='true'?'test':L.getItem('njr_chan')==='"beta"'?'beta':'stable';
  if(want!==WEBCH)location.replace('/nightjar-radio/'+({test:'next/',beta:'beta/',stable:''})[want]+location.search+location.hash)}catch(e){}};njrRoute();</script>

<style>
:root{--bg:#0c0e16;--bg2:#121522;--card:#171a28;--line:rgba(234,242,255,.09);--cream:#f3ecdf;--mut:#a3a7b8;--dim:#676c80;
  --acc:#ffb347;--acc2:#ffd08a;--cor:#ff6b4a;--sky:#86b4ff;--serif:'Fraunces',Georgia,serif;--mono:'JetBrains Mono',ui-monospace,monospace;
  --h-blue:#86b4ff;--h-red:#ff8a8a;--h-orange:#ffad6b;--h-green:#86d9a8;--h-purple:#b8a2ff;--h-pink:#ff9ccc}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font:15px 'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;color:inherit}
.i{width:22px;height:22px;flex:none;display:block}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.dim{color:var(--mut)}
/* sky */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aur{position:absolute;border-radius:50%;background:radial-gradient(closest-side,var(--c),transparent);will-change:transform}
.a1{width:80vw;height:80vw;max-width:720px;max-height:720px;top:-25vh;right:-30vw;--c:#3f6fe0;opacity:.28;animation:drift 30s ease-in-out infinite alternate}
.a2{width:60vw;height:60vw;max-width:560px;max-height:560px;top:35vh;left:-30vw;--c:#ff8a5c;opacity:.13;animation:drift 38s ease-in-out infinite alternate-reverse}
.a3{width:50vw;height:50vw;max-width:480px;max-height:480px;bottom:-15vh;right:-10vw;--c:#b8a2ff;opacity:.13;animation:drift 44s ease-in-out infinite alternate}
.a4{width:40vw;height:40vw;max-width:420px;max-height:420px;top:10vh;left:25vw;--c:#2fae7a;opacity:.06;animation:drift 50s ease-in-out infinite alternate-reverse}
@keyframes drift{to{transform:translate(-6vw,5vh) scale(1.08)}}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff8,transparent),radial-gradient(1.2px 1.2px at 72% 9%,#fff7,transparent),radial-gradient(1.6px 1.6px at 40% 30%,#fff6,transparent),radial-gradient(1.2px 1.2px at 88% 42%,#fff6,transparent),radial-gradient(1.3px 1.3px at 22% 62%,#fff5,transparent),radial-gradient(1px 1px at 60% 75%,#fff5,transparent),radial-gradient(1.4px 1.4px at 92% 85%,#fff5,transparent),radial-gradient(1px 1px at 8% 90%,#fff4,transparent)}
/* layout */
#app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 18px calc(170px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 18px;margin:0 -18px;background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer}.brand img{width:30px;height:30px;border-radius:8px}
.brand span{font:600 22px var(--serif)}.brand em{font-style:italic;font-weight:400;color:var(--acc2)}
.brand small{font:500 10px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--sky);border:1px solid color-mix(in srgb,var(--sky) 45%,transparent);border-radius:999px;padding:4px 7px 3px;margin-left:2px}
header .sp{flex:1}
.ib{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--cream)}
.hero{padding:22px 2px 6px}.hero h1{font:italic 400 clamp(38px,10vw,56px)/1 var(--serif);margin:8px 0 0}.hero h1 b{font-weight:400;color:var(--acc2)}
.sec{margin:26px 0 8px}.sh{display:flex;align-items:baseline;gap:10px;margin:0 2px 12px;flex-wrap:wrap}
.sh h2{font:italic 400 24px/1.1 var(--serif);margin:0}.sh h2 i{font:600 11px var(--mono);font-style:normal;color:var(--hc,var(--acc));margin-right:10px;vertical-align:5px;letter-spacing:.1em}
.sh p{margin:0;width:100%;color:var(--mut);font-size:13px}
.sec:nth-of-type(6n+1){--hc:var(--h-blue)}.sec:nth-of-type(6n+2){--hc:var(--h-orange)}.sec:nth-of-type(6n+3){--hc:var(--h-green)}.sec:nth-of-type(6n+4){--hc:var(--h-purple)}.sec:nth-of-type(6n+5){--hc:var(--h-pink)}.sec:nth-of-type(6n){--hc:var(--h-red)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 6px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:14px;white-space:nowrap}
.chip::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c,var(--acc))}
.chip.on{background:color-mix(in srgb,var(--c,var(--acc)) 18%,transparent);border-color:color-mix(in srgb,var(--c,var(--acc)) 50%,transparent)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:500}
.pill.amb{background:linear-gradient(135deg,var(--acc),var(--cor));color:#1a1210;border:0}
.pill.wide{width:100%;justify-content:center}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
/* presets */
.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pre{position:relative;min-height:104px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(150deg,rgba(255,255,255,.06),rgba(255,255,255,.015));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:22px 6px 10px;overflow:hidden;text-align:center}
.pre .n{position:absolute;left:9px;top:7px;font:600 11px var(--mono);color:var(--pc)}
.pre img,.pre .ph{flex:none;width:42px;height:42px;border-radius:12px;object-fit:cover;background:#22263a}
.pre b{font-size:12px;font-weight:500;line-height:1.25;max-width:100%;overflow-wrap:anywhere;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pre.vac{border-style:dashed;color:var(--dim)}.pre.vac b{font-weight:400}
.pre.live{border-color:color-mix(in srgb,var(--pc) 60%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--pc) 30%,transparent),0 10px 30px -14px var(--pc)}
.pre:nth-child(1){--pc:var(--h-orange)}.pre:nth-child(2){--pc:var(--h-blue)}.pre:nth-child(3){--pc:var(--h-green)}.pre:nth-child(4){--pc:var(--h-purple)}.pre:nth-child(5){--pc:var(--h-pink)}.pre:nth-child(6){--pc:var(--h-red)}
/* station rows & cards */
.row{display:flex;align-items:center;gap:12px;padding:9px 6px;border-radius:14px;cursor:pointer}
.row .lg{width:52px;height:52px;border-radius:12px;flex:none;background:#20243a center/cover;display:grid;place-items:center;font:italic 600 20px var(--serif);color:var(--mut);overflow:hidden}
.row .lg img{width:100%;height:100%;object-fit:cover}
.row .meta{flex:1;min-width:0}.row b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.now b{color:var(--acc2)}
.row .st{color:var(--dim)}.row .st.on{color:var(--acc)}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px 8px}.hs::-webkit-scrollbar{display:none}
.card{flex:none;width:132px;cursor:pointer}.card .lg{width:132px;height:132px;border-radius:18px;background:#1c2034;display:grid;place-items:center;overflow:hidden;font:italic 400 40px var(--serif);color:var(--mut);box-shadow:0 14px 30px -18px #000}
.card .lg img{width:100%;height:100%;object-fit:cover}.card b{display:block;margin-top:8px;font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card span{display:block;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sk{background:linear-gradient(90deg,#171a28,#1e2234,#171a28);background-size:200% 100%;animation:sk 1.4s linear infinite;border-radius:14px}@keyframes sk{to{background-position:-200% 0}}
.empty{padding:26px 10px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--cream);font:italic 400 20px var(--serif);margin-bottom:4px}
.sbar{display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);margin:6px 0 14px}
.sbar input{flex:1;min-width:0;background:none;border:0;outline:0;padding:14px 0;font-size:16px}
select.sel{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
select.sel option{background:#171a28}
/* dial */

.dial{overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory}.dial::-webkit-scrollbar{display:none}

.tk{flex:none;width:60px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%}



.dialcard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:1px solid var(--line);background:rgba(255,255,255,.035);margin-top:12px;min-height:84px}
.dialcard .lg{width:56px;height:56px;border-radius:14px;flex:none;background:#20243a;overflow:hidden;display:grid;place-items:center;font:italic 600 22px var(--serif);color:var(--mut)}.dialcard .lg img{width:100%;height:100%;object-fit:cover}
.dialcard b{display:block;font:italic 400 21px/1.15 var(--serif)}.dialcard span{font-size:13px;color:var(--mut)}

/* mini player */
#mini{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:30;max-width:736px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:20px;background:rgb(26,29,44);border:1px solid var(--line);box-shadow:0 18px 40px -16px #000;cursor:pointer}
#mini .lg{width:46px;height:46px;border-radius:12px;background:#22263a;overflow:hidden;flex:none;display:grid;place-items:center;font:italic 600 18px var(--serif);color:var(--mut)}#mini .lg img{width:100%;height:100%;object-fit:cover}
#mini .meta{flex:1;min-width:0}#mini b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#mini span{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.live{display:inline-flex;align-items:center;gap:5px;font:600 10px var(--mono);letter-spacing:.14em;color:var(--cor)}.live::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--cor)}
body.playing .live::before{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}
body.buffering .live{color:var(--acc)}body.buffering .live::before{background:var(--acc)}
#tabs{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;max-width:736px;margin:0 auto;display:flex;padding:5px;border-radius:22px;background:rgb(20,23,36);border:1px solid var(--line)}
#tabs button{flex:1;display:grid;place-items:center;padding:12px 0;border-radius:16px;color:var(--mut);position:relative}
#tabs button .i{width:24px;height:24px}
#tabs button.on{color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,transparent)}
#tabs button.on::after{content:'';position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--tc);box-shadow:0 0 8px var(--tc)}
#tabs [data-tab=home]{--tc:var(--h-orange)}#tabs [data-tab=dial]{--tc:var(--h-blue)}#tabs [data-tab=search]{--tc:var(--h-purple)}#tabs [data-tab=sport]{--tc:var(--h-green)}#tabs [data-tab=library]{--tc:var(--h-pink)}
/* full player */
#np{position:fixed;inset:0;z-index:50;scrollbar-width:none;background:radial-gradient(120% 70% at 50% 0%,#1f2a52,transparent 60%),var(--bg);transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:0 20px calc(30px + env(safe-area-inset-bottom))}
#np.on{transform:none}
.nph{display:flex;align-items:center;gap:2px;padding:10px 0 2px}.npst{font-size:19px}.nph .t{flex:1;text-align:center;min-width:0}
.npq{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin:8px 0 0}.npq>span{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:11.5px;color:var(--mut);background:rgba(255,255,255,.05);border:1px solid var(--line);white-space:nowrap}
.npq .qq{color:var(--cream);font-family:var(--mono);font-size:10.5px;letter-spacing:.03em}.npq .qq b{font-size:11.5px}.npq .qH{border-color:rgba(134,217,168,.45)}.npq .qL{border-color:rgba(255,150,100,.45)}
.npq .qs .sig i{background:#86d9a8}.npq .live{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:#86d9a8}body.buffering .npq .live{color:#ffd08a}.nph .t b{display:block;font-weight:500;margin-top:2px}
.radio{position:relative;width:min(92vw,420px);margin:8px auto 2px;--hue:220}
.rbody{position:relative;border-radius:30px;padding:12px 12px 0;background:linear-gradient(180deg,#2c2f3a,#17191f 70%);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -2px 0 rgba(0,0,0,.5),0 34px 60px -28px #000,0 0 0 1px rgba(255,255,255,.05)}
.rscr{position:relative;aspect-ratio:1.02;border-radius:20px;overflow:hidden;background:#05060a;box-shadow:inset 0 0 0 2px #0a0b10,inset 0 0 0 3px rgba(255,255,255,.05)}
.rscr .bg{position:absolute;inset:0;background:radial-gradient(90% 70% at 30% 20%,hsl(var(--hue) 70% 45% / .55),transparent 70%),radial-gradient(80% 60% at 90% 100%,hsl(calc(var(--hue) + 60) 70% 45% / .4),transparent 70%),#07080d;opacity:.35;transition:opacity .8s}
body.playing .rscr .bg,body.buffering .rscr .bg{opacity:1}
.rscr .glass{position:absolute;inset:0;background:linear-gradient(125deg,rgba(255,255,255,.09),transparent 34%);pointer-events:none}
.rtop{position:absolute;left:5%;right:5%;top:5%;display:flex;align-items:center;gap:8px;font:600 11px var(--mono);letter-spacing:.08em;color:rgba(255,255,255,.75)}
.rtop .sp{flex:1}.rtop .dab{padding:2px 6px;border-radius:5px;border:1px solid rgba(255,255,255,.3);font-size:9.5px}
.sig{display:flex;align-items:flex-end;gap:2px;height:11px}.sig i{width:3px;border-radius:1px;background:rgba(255,255,255,.75)}.sig i:nth-child(1){height:30%}.sig i:nth-child(2){height:55%}.sig i:nth-child(3){height:80%}.sig i:nth-child(4){height:100%}
body.buffering .sig i:nth-child(n+3){opacity:.25}
.rmid{position:absolute;left:5%;right:5%;top:14%;bottom:20%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}.rmid>*{flex-shrink:0}
.rart{width:min(34%,120px);aspect-ratio:1;border-radius:18px;overflow:hidden;background:hsl(var(--hue) 35% 22%);display:grid;place-items:center;font:italic 600 34px var(--serif);color:hsl(var(--hue) 60% 82%);box-shadow:0 14px 30px -12px #000,0 0 0 1px rgba(255,255,255,.08)}
.rart img{width:100%;height:100%;object-fit:cover}
.rname{font:italic 400 clamp(19px,5.6vw,26px)/1.22 var(--serif);padding:0 .15em .06em;color:#fff;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rsub{font-size:12.5px;line-height:1.45;color:rgba(255,255,255,.62);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rbot{position:absolute;left:5%;right:5%;bottom:5%;display:flex;align-items:flex-end;gap:10px;font:600 10px var(--mono);letter-spacing:.1em;color:rgba(255,255,255,.6)}
.eq{flex:1;display:flex;align-items:flex-end;gap:2px;height:30px}
.eq i{flex:1;height:100%;border-radius:2px 2px 0 0;background:linear-gradient(0deg,hsl(var(--hue) 80% 65%),hsl(calc(var(--hue) + 60) 85% 72%));transform-origin:bottom;transform:scaleY(.08);opacity:.85}
body.playing .eq i{animation:eq var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
@keyframes eq{0%{transform:scaleY(.12)}50%{transform:scaleY(var(--h))}100%{transform:scaleY(.3)}}
body.calm .eq i{animation:none!important;transform:scaleY(.25)}
.rstrip{display:flex;align-items:center;gap:12px;padding:12px 6px 14px}
.rspk{flex:1;height:44px;border-radius:12px;background:radial-gradient(circle,#0b0c10 0 1.6px,transparent 1.8px) 0 0/7px 7px,linear-gradient(180deg,#24262f,#1b1d24);box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.rpre{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.rpre i{width:16px;height:9px;border-radius:3px;background:#2d303b;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.rpre i.on{background:hsl(var(--hue) 85% 65%);box-shadow:0 0 8px hsl(var(--hue) 85% 65%)}
.knob{width:46px;height:46px;border-radius:50%;flex:none;background:conic-gradient(from 0deg,#3a3d48,#1e2028,#3a3d48,#1e2028,#3a3d48);box-shadow:0 6px 12px -4px #000,inset 0 1px 0 rgba(255,255,255,.18),0 0 0 3px #121318;position:relative}
.knob::after{content:'';position:absolute;left:50%;top:6px;width:3px;height:10px;margin-left:-1.5px;border-radius:2px;background:hsl(var(--hue) 85% 68%);box-shadow:0 0 6px hsl(var(--hue) 85% 68%)}
.knob.k2{transform:rotate(var(--kr,40deg));transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
.rled{width:7px;height:7px;border-radius:50%;background:#3a1a10;flex:none}body.playing .rled{background:#ff6b4a;box-shadow:0 0 8px #ff6b4a}
.rfeet{display:flex;justify-content:space-between;padding:0 16%}.rfeet i{width:14%;height:6px;border-radius:0 0 5px 5px;background:#0e0f13}
.npt{text-align:center;margin-top:6px}.npt h2{font:italic 400 clamp(28px,8vw,40px)/1.1 var(--serif);margin:6px 0}.npt p{margin:0;color:var(--mut)}
.tags{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}.tags span{font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--mut)}
.ctrls{display:flex;align-items:center;justify-content:center;gap:26px;margin:12px 0 10px}
.ctrls .ib{width:56px;height:56px}.ctrls .ib .i{width:28px;height:28px}
.bigplay{width:70px;height:70px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--cor));color:#1a1210;box-shadow:0 18px 40px -16px var(--cor)}.bigplay .i{width:34px;height:34px}
.npx{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.npx .dots{font-size:13px;letter-spacing:1px;line-height:24px;height:24px}.npx button{min-width:0;font-size:11px!important;padding:9px 2px!important;gap:4px!important}.npx button span{white-space:nowrap}
.npx button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12.5px}
.npx button.on{color:var(--acc2);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.vol{display:flex;align-items:center;gap:12px;margin:12px 4px 0;color:var(--mut)}
.vol input{flex:1;accent-color:var(--acc)}
/* sheet */
#sheetbg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s}
#sheetbg.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-width:640px;margin:0 auto;max-height:86vh;overflow-y:auto;background:#151827;border-radius:26px 26px 0 0;border:1px solid var(--line);padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
#sheet.on{transform:none}#sheet::before{content:'';display:block;width:42px;height:4px;border-radius:4px;background:rgba(255,255,255,.2);margin:0 auto 14px}
#sheet h3{font:italic 400 26px var(--serif);margin:4px 0 12px}
.mi{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;font-size:16px;text-align:left}
.mi .i{color:var(--mut)}
.tog{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14.5px}.tog input{width:22px;height:22px;accent-color:var(--acc)}
#toast{position:fixed;left:50%;bottom:calc(160px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#efe6d6;color:#1b1820;padding:11px 18px;border-radius:14px;font-weight:500;font-size:14px;transition:.25s;max-width:86vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
/* car & night */
#car,#nl{position:fixed;inset:0;z-index:80;background:#000;display:flex;flex-direction:column}
#car{padding:max(14px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));color:#9c8f80}
.carhd{display:flex;align-items:center;gap:12px;font:500 15px var(--mono)}.carhd span{flex:1;text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.carhd button{background:#141114;border:1px solid #2a2429;color:#8a7e71;border-radius:999px;padding:10px 18px;font:500 13px var(--mono);letter-spacing:.1em}
.carsong{flex:1;display:flex;flex-direction:column;justify-content:center;padding:10px 4px}.carsong b{font:italic 400 clamp(32px,9vw,54px)/1.1 var(--serif);color:#c9b9a4}.carsong span{font-size:20px;margin-top:10px;color:#7d7266}
.carbtns{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:12px;height:min(34vh,240px)}
.carbtns button{border-radius:26px;background:#141114;color:#b8a892;display:grid;place-items:center}.carbtns .i{width:44px;height:44px}
#carpp{background:#3a2a14;color:#ffcf8a}#carpp .i{width:60px;height:60px}
#car.dim>*{opacity:.42;transition:opacity 1.2s}
#nl{align-items:center;justify-content:center;text-align:center;color:rgba(255,179,71,.2)}
#nl .c{font:400 clamp(64px,22vw,120px)/1 var(--mono);transition:transform 3s}#nl .s{font:italic 400 20px var(--serif);color:rgba(243,233,216,.16);margin-top:16px}
#nl .h{position:absolute;bottom:60px;font:500 12px var(--mono);letter-spacing:.18em;text-transform:uppercase;opacity:0;transition:opacity .3s;color:rgba(255,179,71,.3)}#nl.hint .h{opacity:1}
/* recap */
.recap{border-radius:22px;padding:18px;background:radial-gradient(120% 90% at 0 0,rgba(134,180,255,.18),transparent 60%),radial-gradient(90% 80% at 100% 100%,rgba(255,138,92,.14),transparent 60%),rgba(255,255,255,.03);border:1px solid var(--line)}
.recap .big{font:italic 400 54px/1 var(--serif);background:linear-gradient(180deg,#f3ecdf 35%,var(--sky));-webkit-background-clip:text;background-clip:text;color:transparent}
.recap .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:14px 0}.recap .stats div{padding-left:10px;border-left:1px solid rgba(134,180,255,.35)}.recap .stats b{display:block;font:italic 400 24px var(--serif)}.recap .stats span{font:500 9.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sky)}
.bars{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:6px}.bars i{flex:1;border-radius:3px 3px 1px 1px;background:linear-gradient(var(--sky),rgba(134,180,255,.2))}
.foot{text-align:center;padding:34px 0 30px;opacity:.75}.foot img{width:44px;height:44px;border-radius:12px}.foot b{display:block;font:600 19px var(--serif);margin-top:8px}.foot b em{font-style:italic;font-weight:400;color:var(--acc2)}.foot span{font:500 10px var(--mono);letter-spacing:.3em;text-transform:uppercase;color:var(--dim)}
/* playful */
body:not(.calm) :is(.pill,.chip,.pre,.card,.row,.ib,#tabs button,.npx button,.bigplay):active{transform:scale(.94)}
.pill,.chip,.pre,.card,.row,.ib,#tabs button,.npx button,.bigplay{transition:transform .22s cubic-bezier(.3,1.7,.5,1)}
.zap{position:fixed;z-index:95;pointer-events:none;translate:-50% -50%;animation:zap .95s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes zap{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}

.sotd{margin-top:14px;padding:16px;border-radius:22px;cursor:pointer;background:radial-gradient(100% 120% at 0 0,hsl(var(--hue) 70% 45% / .35),transparent 60%),radial-gradient(80% 100% at 100% 100%,hsl(calc(var(--hue) + 60) 70% 45% / .22),transparent 60%),rgba(255,255,255,.03);border:1px solid hsl(var(--hue) 60% 60% / .25)}
.sotdin{display:flex;align-items:center;gap:14px;margin-top:12px}.sotdin .lg{width:84px;height:84px;border-radius:18px;flex:none;background:hsl(var(--hue) 35% 22%);display:grid;place-items:center;overflow:hidden;font:italic 600 30px var(--serif);color:hsl(var(--hue) 60% 82%);box-shadow:0 12px 26px -14px #000}.sotdin .lg img{width:100%;height:100%;object-fit:cover}
.sotdin b{display:block;font:italic 400 24px/1.1 var(--serif)}.sotdin>div>span{font-size:13px;color:var(--mut)}
.sotdplay{width:50px;height:50px;border-radius:50%;flex:none;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--cor));color:#1a1210}
.nearask{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:18px;border:1px dashed var(--line);background:rgba(255,255,255,.025)}.nearask b{display:block;font:italic 400 19px var(--serif)}.nearask span{font-size:13px;color:var(--mut)}.nearask .pill{align-self:flex-start}
.gcard{display:flex;flex-direction:column;align-items:center;gap:8px}.gch{margin:0 -18px;padding:2px 18px 4px;align-self:stretch}
.gwrap{position:relative;width:min(78vw,300px);height:min(78vw,300px);flex:none}
#globe{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
.gwrap::before{content:'';position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(closest-side,rgba(110,160,255,.22),transparent);pointer-events:none}
.gwhere{display:flex;align-items:center;gap:12px;margin:14px 2px 4px}.gflag{font-size:30px}.gwhere b{display:block;font:italic 400 19px var(--serif)}.gwhere span{font-size:12.5px;color:var(--mut)}
.rsong{font-size:13.5px;font-weight:500;line-height:1.4;color:#fff;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.rsong:empty{display:none}
.updb{position:fixed;left:12px;right:12px;top:calc(70px + env(safe-area-inset-top));z-index:60;max-width:736px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:18px;background:linear-gradient(135deg,#2a3a6e,#1b2340);border:1px solid rgba(134,180,255,.35);text-align:left;box-shadow:0 14px 30px -14px #000}
.updb b{display:block;font-weight:600}.updb span{font-size:13px;color:var(--mut)}
.alarm{padding:16px;border-radius:22px;border:1px solid var(--line);background:rgba(255,255,255,.03);transition:background .3s}
.alarm.on{background:radial-gradient(120% 100% at 0 0,rgba(255,179,71,.14),transparent 60%),rgba(255,255,255,.03);border-color:rgba(255,179,71,.3)}
.alrow{display:flex;align-items:center;gap:12px}
.altime{position:relative;flex:1;min-width:0;cursor:pointer}#al_show{display:block;font:400 clamp(40px,13vw,54px)/1.05 var(--mono);letter-spacing:-.02em;color:var(--cream)}
.alarm:not(.on) #al_show{color:var(--mut)}
#al_t{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;color-scheme:dark;cursor:pointer}
.sw{position:relative;width:56px;height:32px;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;z-index:1}.sw i{position:absolute;inset:0;border-radius:999px;background:#2a2e40;transition:.25s}
.sw i::after{content:'';position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#cfd2dc;transition:.25s}
.sw input:checked+i{background:linear-gradient(135deg,var(--acc),var(--cor))}.sw input:checked+i::after{transform:translateX(24px);background:#fff}
.days{display:flex;gap:6px}.days button{flex:1;aspect-ratio:1;max-width:46px;border-radius:50%;border:1px solid var(--line);font-weight:600;color:var(--mut)}
.days button.on{background:color-mix(in srgb,var(--acc) 22%,transparent);border-color:color-mix(in srgb,var(--acc) 55%,transparent);color:var(--acc2)}
.modal{position:fixed;inset:0;z-index:96;display:grid;place-items:center;padding:20px;background:rgba(4,5,10,.72);opacity:0;transition:opacity .25s}
.modal.on{opacity:1}.mcard{position:relative;width:100%;max-width:400px;max-height:88vh;overflow-y:auto;border-radius:28px;padding:26px 22px 20px;background:radial-gradient(120% 70% at 50% 0%,#24305e,#141726 60%);border:1px solid rgba(134,180,255,.22);box-shadow:0 30px 70px -20px #000;transform:translateY(18px) scale(.97);transition:transform .32s cubic-bezier(.2,1.2,.4,1)}
.modal.on .mcard{transform:none}.mcard.swap{transition:none;animation:mswap .28s ease}@keyframes mswap{from{opacity:.4}}
.mcard h2{font:italic 400 30px/1.1 var(--serif);text-align:center;margin:8px 0 10px}.mcard>p{color:var(--mut);text-align:center;line-height:1.5;margin:0 0 6px}
.mic{width:64px;height:64px;margin:0 auto 10px;border-radius:20px;display:grid;place-items:center;font-size:28px;color:var(--mc);background:color-mix(in srgb,var(--mc) 16%,transparent);border:1px solid color-mix(in srgb,var(--mc) 35%,transparent)}.mic .i{width:30px;height:30px}
.mbtns{display:flex;justify-content:space-between;gap:10px;margin-top:18px}.mbtns .pill{flex:1;justify-content:center}.mbtns.one{justify-content:center}.mbtns>span{flex:1}
.news{display:flex;flex-direction:column;gap:10px;margin-top:12px}.nrow{display:flex;gap:12px;padding:12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.nrow>span{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:20px;background:color-mix(in srgb,var(--mc) 18%,transparent)}.nrow b{display:block;font-weight:600}.nrow p{margin:3px 0 0;font-size:13px;color:var(--mut);line-height:1.45}
.mskip{position:absolute;right:16px;top:14px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);padding:6px}
.tourart{width:150px;height:150px;margin:14px auto 16px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--mc) 45%,transparent),color-mix(in srgb,var(--mc) 10%,transparent) 70%);box-shadow:0 0 50px -10px var(--mc),inset 0 0 0 1px color-mix(in srgb,var(--mc) 40%,transparent);color:#fff}
.tourart .i{width:64px;height:64px;stroke-width:1.4}.tourart img{width:96px;height:96px;border-radius:24px;box-shadow:0 14px 30px -10px #000}
body:not(.calm) .modal.on .tourart{animation:tfloat 3.4s ease-in-out infinite}@keyframes tfloat{50%{transform:translateY(-6px)}}
.tourm .mcard p{min-height:72px}
.tdots{display:flex;justify-content:center;gap:6px;margin-top:14px}.tdots i{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.2);transition:.25s}.tdots i.on{width:22px;background:var(--acc)}
/* skins */
.npinfo{text-align:center;margin-top:4px}.npinfo h2{font:italic 400 clamp(21px,6vw,28px)/1.15 var(--serif);margin:0 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.npinfo p{margin:0 0 4px;color:var(--mut);font-size:13.5px}
.skins{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 8px}.skins button{padding:7px 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;color:var(--mut)}.skins button.on{color:var(--acc2);border-color:color-mix(in srgb,var(--acc) 50%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.mq{display:block;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.mq.run{text-overflow:clip}.mq.run>span{display:inline-block;animation:mq 14s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
body.calm .mq.run>span{animation:none}
.radio.wood{width:min(90vw,400px)}
.wcab{position:relative;border-radius:30px 30px 18px 18px;padding:16px 16px 18px;background:linear-gradient(180deg,#8a5a2e,#5c3a1c 60%,#3e260f);box-shadow:inset 0 2px 0 rgba(255,220,170,.25),inset 0 -8px 20px rgba(0,0,0,.35),0 30px 60px -26px #000}
.wcab::before{content:'';position:absolute;inset:0;border-radius:inherit;background:repeating-linear-gradient(100deg,rgba(0,0,0,.08) 0 3px,transparent 3px 9px);pointer-events:none}
.wwin{position:relative;height:78px;border-radius:44px 44px 10px 10px;background:linear-gradient(180deg,#2a1c0c,#1a1108);box-shadow:inset 0 0 0 3px #b98a4c,inset 0 0 18px rgba(0,0,0,.7);overflow:hidden;transition:background .8s}
body.playing .wwin,body.buffering .wwin{background:radial-gradient(circle at 50% 60%,rgba(255,200,110,.75),rgba(170,100,30,.45) 60%,#2a1c0c)}
.wscale{position:absolute;left:8%;right:8%;top:18px;display:flex;justify-content:space-between;font:600 10px var(--mono)}.wscale i{font-style:normal;color:#3a2410}
.wtick{position:absolute;left:8%;right:8%;top:36px;height:16px;background:repeating-linear-gradient(90deg,#3a2410 0 1px,transparent 1px 2.5%)}
.wnd{position:absolute;top:10px;bottom:8px;width:2px;background:#d6331d;box-shadow:0 0 6px #ff5a3c;left:calc(8% + var(--np) * 84%);transition:left 1.2s cubic-bezier(.3,1.3,.5,1)}

function logSong(){if(!song||!cur)return;const t=song.trim();if(t.length<3||SJUNK.test(t)||t.toLowerCase()===String(cur.n).toLowerCase())return;

  // Same song (ignoring case, punctuation, "(Radio Edit)" etc. and artist/title order) heard in the last 3 hours on any station? Just refresh its time.
  const i=h.findIndex(x=>sKey(x.s)===k&&Date.now()-x.t<3*36e5);if(i>=0){if(i===0)return;h.splice(i,1)}

 ['Getting started',[
  ['Is Nightjar Radio free?','Yes — completely free, with no ads and no account. If you enjoy it, there’s an optional “Buy me a coffee” link at the bottom of Settings.'],
  ['Where do the stations come from?','From radio-browser.info, a free community directory of over 50,000 stations worldwide. Nightjar Radio doesn’t run any stations itself — it tunes you in to the stations’ own streams.'],
  ['A station is missing or the details are wrong','Stations are added and edited on radio-browser.info, so anyone can add a missing one or fix its details there. Changes show up in the app shortly after.'],
  ['How do I change my home country?','Settings → Home country. It changes “Popular in…”, the Sport tab, football fixtures and seasonal themes.'],

 ['Listening',[
  ['Why won’t a station play?','Usually the station is offline, has moved its stream, or only allows listeners in its own country. Try again later, or pick another station.'],
  ['How do presets work?','Tap an empty preset while a station is playing to save it there. Long-press a preset to clear or replace it. You can also save from the player with the “Preset” button.'],
  ['Can I set a sleep timer?','Yes — tap “Sleep” in the full player. Or tap “Bedtime” for a calm station, a softer volume, a sleep timer and the night-light clock in one go.'],

   ...(d.tags.length?[['#4a1630','#16060f',`<div class="wa mono" style="--d:.1s">Your sound</div><h1 class="wa w-tag" style="--d:.35s">${esc(d.tags[0][0])}</h1><div class="w-chips">${d.tags.slice(1).map((t,i)=>`<span class="wa" style="--d:${.7+i*.12}s">${esc(t[0])}</span>`).join('')}</div>`]]:[]),
   ...(d.ctry.length?[['#123052','#050d18',`<div class="wa mono" style="--d:.1s">You tuned in to</div><div class="wa w-num" style="--d:.35s">${d.ctry.length} ${d.ctry.length===1?'country':'countries'}</div><div class="w-flags">${d.ctry.slice(0,15).map(([c],i)=>`<span class="wa" style="--d:${.6+i*.07}s">${flag(c)}</span>`).join('')}</div><p class="wa" style="--d:1.4s">Most from <b>${esc(cName(d.ctry[0][0]))}</b></p>`]]:[]),
   ['#2a2f12','#0c0e05',`<div class="wa mono" style="--d:.1s">You’re a</div><div class="wa w-big" style="--d:.3s">${persona[1]}</div><h1 class="wa" style="--d:.5s">${persona[0]}</h1><div class="wa w-clock" style="--d:.8s">${d.hrs.map((v,i)=>`<i class="${i===d.peak?'pk':''}" style="height:${Math.max(4,v/Math.max(...d.hrs)*100)}%"></i>`).join('')}</div><div class="wa w-axis" style="--d:.8s"><span>12am</span><span>6am</span><span>12pm</span><span>6pm</span></div><p class="wa" style="--d:1.1s">${persona[2]} Busiest month: <b>${new Date(2000,d.bm).toLocaleDateString('en-GB',{month:'long'})}</b>.</p>`],
   ['#1d2a52','#0b0f1f',`<div class="wa w-big" style="--d:.1s">✦</div><h1 class="wa" style="--d:.3s">Thanks for listening</h1><p class="wa" style="--d:.6s">${fmtH(d.secs)} · ${d.top.length} stations${d.ctry.length?` · ${d.ctry.length} countries`:''}</p><div class="wa w-btns" style="--d:.9s"><button class="pill amb" data-w="share">${ic('share')}Share</button><button class="pill" data-w="close">Done</button></div>`]];
  return S1}
let wrapT=0;
function wrapPlay(){const d=wrapData();if(d.secs<60)return toast('Listen a little more first — Wrapped needs a few minutes of radio');const sl=wrapSlides(d),w=$('#wrap');let k=0;
  w.hidden=false;history.pushState({w:1},'');
  const show=()=>{clearTimeout(wrapT);const[c1,c2,h]=sl[k];w.style.setProperty('--c1',c1);w.style.setProperty('--c2',c2);
    w.innerHTML=`<div class="wbars">${sl.map((_,j)=>`<i class="${j<k?'done':j===k?'now':''}"><b></b></i>`).join('')}</div><button class="wx" data-w="close" aria-label="Close">${ic('x')}</button><div class="wslide">${h}</div>`;
    if(k<sl.length-1)wrapT=setTimeout(()=>{k++;show()},7000)};
  w.onclick=e=>{const b=e.target.closest('[data-w]');if(b){if(b.dataset.w==='close')return wrapClose();if(b.dataset.w==='share'){const txt=`My ${d.y} on Nightjar Radio: ${fmtH(d.secs)} of radio, ${d.top.length} stations${d.ctry.length?`, ${d.ctry.length} countries`:''}. Top station: ${d.top[0].n}.`;if(NAT)NAT.share('My Radio Wrapped',txt);else navigator.share?.({text:txt}).catch(()=>{});return}}
    if(e.clientX<innerWidth*.3){if(k>0){k--;show()}}else if(k<sl.length-1){k++;show()}};
  show()}
function wrapClose(pop){const w=$('#wrap');if(w.hidden)return;clearTimeout(wrapT);w.hidden=true;w.innerHTML='';if(!pop)history.back()}
(()=>{const m=$('#mini');let x0=null,y0=0,dx=0,drag=false;
  m.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;drag=false;m.style.transition='none'},{passive:true});
  m.addEventListener('touchmove',e=>{if(x0==null)return;const tx=e.touches[0].clientX-x0,ty=e.touches[0].clientY-y0;if(!drag&&Math.abs(tx)>10&&Math.abs(tx)>Math.abs(ty))drag=true;
    if(drag){dx=tx;const pause=!playing&&!buffering;m.style.transform=`translateX(${pause?dx:dx*.25}px)`;m.style.opacity=pause?String(Math.max(.2,1-Math.abs(dx)/260)):'1'}},{passive:true});
  m.addEventListener('touchend',()=>{if(x0==null)return;x0=null;m.style.transition='transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s';
    if(drag&&Math.abs(dx)>90&&!playing&&!buffering){m.style.transform=`translateX(${dx>0?'110%':'-110%'})`;m.style.opacity='0';
      setTimeout(()=>{miniHidden=true;LS.set('miniHidden',true);m.style.transition='none';m.style.transform='';m.style.opacity='';renderMini()},280);m.dataset.swiped=Date.now()}
    else{m.style.transform='';m.style.opacity='';if(drag){m.dataset.swiped=Date.now();if(Math.abs(dx)>60)toast('Pause first to swipe the player away')}}});
  m.addEventListener('click',e=>{if(Date.now()-(+m.dataset.swiped||0)<400){e.stopImmediatePropagation();e.preventDefault()}},true)})();
window.njrAction=a=>{if(modalOpen)closeModal();if(npOpen)closeNP();if(sheetOpen)closeSheet();if(nlOn)nlExit();
  if(a==='globe'){go('home');setTimeout(()=>{$('#globe')?.scrollIntoView({block:'center',behavior:'smooth'});setTimeout(globeSpin,700)},500)}
  else if(a==='dial'){go('dial');const t=setInterval(()=>{if(window.dialSpin&&$('.tk.has')){clearInterval(t);setTimeout(()=>window.dialSpin(),400)}},200);setTimeout(()=>clearInterval(t),12000)}
  else if(a==='bed')bedtime()};
document.addEventListener('click',e=>{const a=e.target.closest('a.bmc');if(a&&NAT){e.preventDefault();NAT.openUrl(a.href)}});
/* ---------- start ---------- */
go('home');renderMini();if(cur)meta();poke();setTimeout(onboard,700);
/* Shortcuts from the installed app's icon (right-click on Windows/Mac, long-press on Android home screen): ?do=... */
(()=>{const d=new URLSearchParams(location.search).get('do');if(!d)return;history.replaceState(null,'',location.pathname);
  setTimeout(()=>{if(d==='bedtime')bedtime();else if(d==='globe'){go('home');setTimeout(()=>{$('#gres')?.scrollIntoView({block:'center',behavior:'smooth'});globeSpin()},350)}else if(d==='dial')go('dial');else if(d==='favs')go('library')},450)})();

if(!NAT&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(NAT){natSync('presets');natSync('favs');natSync('recent');NAT.setVolume(S.vol);document.body.classList.add('native')}

/* iPhone/iPad in Safari: suggest Add to Home Screen. Safari can clear a website's saved data (presets, favourites) after
   7 days without a visit; home-screen web apps are kept. Shown once, then again after 30 days if dismissed. */
(function(){try{
  if(!document.documentElement.classList.contains('ios')||NAT||navigator.standalone||matchMedia('(display-mode: standalone)').matches)return;
  if(Date.now()-(LS.get('a2hsAt',0)||0)<30*864e5)return;
  setTimeout(()=>{if(document.getElementById('a2hs'))return;const d=document.createElement('div');d.id='a2hs';d.setAttribute('role','status');
    const sh='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-label="Share"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';
    d.innerHTML=`<div style="flex:1"><b>Add it to your Home Screen</b>Tap ${sh} <b style="display:inline;font:inherit;font-weight:600">Share</b>, then <b style="display:inline;font:inherit;font-weight:600">Add to Home Screen</b>. It opens like an app and keeps your presets and favourites safe.</div><button class="x" type="button">Got it</button>`;
    d.querySelector('.x').onclick=()=>{LS.set('a2hsAt',Date.now());d.remove()};document.body.appendChild(d)},5000)
}catch(e){}})();
</script>
