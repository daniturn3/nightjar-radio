name: Release app to everyone
# Copies the current TEST build to the public download, so every user gets the "Update available" pop-up.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency: radio-android
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote test build
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          n=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/radio-beta --jq '.name' | grep -o 'build [0-9]*' | grep -o '[0-9]*')
          if [ -z "$n" ]; then echo "::error::No test build found"; exit 1; fi
          cur=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/radio-app --jq '.name' 2>/dev/null | grep -o '[0-9]*$' || true)
          if [ "$cur" = "$n" ]; then echo "Build $n is already public"; exit 0; fi
          gh release download radio-beta -p nightjar-radio-beta.apk -O nightjar-radio.apk --clobber
          # Keep an all-time download total: save the outgoing public build's count before it's replaced
          cnt=$(gh api repos/$GITHUB_REPOSITORY/releases/tags/radio-app --jq '[.assets[]|select(.name=="nightjar-radio.apk")|.download_count][0] // 0' 2>/dev/null || echo 0)
          if [ -n "$cur" ]; then
            git config user.name "github-actions"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git pull -q --rebase origin main
            python3 -c "import json,sys,datetime;p='stats/downloads.json';d=json.load(open(p));d=[x for x in d if x['build']!=int(sys.argv[1])];d.append({'build':int(sys.argv[1]),'downloads':int(sys.argv[2]),'until':datetime.date.today().isoformat()});json.dump(d,open(p,'w'),indent=1)" "$cur" "$cnt"
            git add stats/downloads.json && git commit -qm "Download stats: build $cur had $cnt downloads [skip ci]" && git push -q origin HEAD:main || true
          fi
          gh release view radio-app >/dev/null 2>&1 || gh release create radio-app --title "Nightjar Radio" --notes "Android app for Nightjar Radio" --latest=false
          gh release upload radio-app nightjar-radio.apk --clobber
          { cat android/RELEASE_NOTES.md; echo; echo "_Build $n_"; } > notes.md
          gh release edit radio-app --title "Nightjar Radio build $n" --notes-file notes.md
          echo "Build $n is now public"
