name: Publish app
# Publishes the current TEST build to the public Beta channel straight away.
# Stable gets it automatically after 10 days in beta (see radio-stable.yml),
# or immediately if "Also put it on Stable now" is ticked (for urgent fixes).
on:
  workflow_dispatch:
    inputs:
      stable_now:
        description: 'Also put it on Stable now (urgent fix)'
        type: boolean
        default: false
      web_only:
        description: "Website only (no app update for Beta users)"
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
concurrency: radio-android
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env: { GH_TOKEN: '${{ github.token }}' }
        run: python3 .github/scripts/channels.py publish ${{ inputs.stable_now && '--stable-now' || '' }} ${{ inputs.web_only && '--web-only' || '' }}
