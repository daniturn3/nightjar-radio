name: Update stable app
# Every day: once a beta build has waited 10+ days, Stable updates to the CURRENT beta build.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: radio-android
jobs:
  stable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Promote to stable if due
        env: { GH_TOKEN: '${{ github.token }}', STABLE_AFTER_DAYS: '10' }
        run: python3 .github/scripts/channels.py auto-stable
